name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix-build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        java: [17]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            java: 21
          - os: ubuntu-latest
            java: 25
          - os: ubuntu-latest
            java: 26

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-os-${{ matrix.os }}-java-${{ matrix.java }}
      cancel-in-progress: true

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: "bash"
    name: "Build on ${{ matrix.os }} with Java ${{ matrix.java }}"
    env:
      DEFAULT_JAVA: 17
      DEFAULT_OS: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        name: Set up Java ${{ matrix.java }}
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
          cache: "maven"

      - name: Cache SonarQube packages
        if: ${{ env.DEFAULT_OS == matrix.os && env.DEFAULT_JAVA == matrix.java }}
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build with Java ${{ matrix.java }}
        run: |
          mvn --batch-mode -T 1C clean org.jacoco:jacoco-maven-plugin:prepare-agent install \
              -Dossindex.skip=true \
              -Djava.version=${{ matrix.java }}

      - name: Sonar analysis
        if: ${{ env.DEFAULT_OS == matrix.os && env.DEFAULT_JAVA == matrix.java && env.SONAR_TOKEN != null }}
        run: |
          mvn --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.token=$SONAR_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Verify reproducible build
        # Build fails on Windows with error: "Failed to execute goal org.apache.maven.plugins:maven-artifact-plugin:3.5.0:compare (default-cli) on project openfasttrace-reporter-plaintext: Could not copy D:\a\openfasttrace\openfasttrace\reporter\plaintext\target\openfasttrace-reporter-plaintext-3.8.0.buildcompareto D:\a\openfasttrace\openfasttrace\target\openfasttrace-root-0.0.0.buildcompare"
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          mvn --batch-mode -T 1C clean verify artifact:compare -DskipTests \
              -Dossindex.skip=true \
              -Djava.version=${{ matrix.java }}

      - name: Archive oft binary
        uses: actions/upload-artifact@v7
        if: ${{ env.DEFAULT_OS == matrix.os && env.DEFAULT_JAVA == matrix.java }}
        with:
          name: openfasttrace-binaries
          path: |
            product/target/openfasttrace-*.jar
            !product/target/openfasttrace-*-javadoc.jar
            !product/target/openfasttrace-*-sources.jar
          if-no-files-found: error

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@v7
        if: ${{ env.DEFAULT_OS == matrix.os && env.DEFAULT_JAVA == matrix.java }}
        with:
          name: openfasttrace-spdx
          path: product/target/site/*.spdx3.json
          if-no-files-found: error

      - name: Run self-trace
        run: ./oft-self-trace.sh

      - name: Upload self-tracing report
        uses: actions/upload-artifact@v7
        if: ${{ env.DEFAULT_OS == matrix.os && env.DEFAULT_JAVA == matrix.java }}
        with:
          name: self-tracing-report
          path: target/self-trace-report.html
          if-no-files-found: error

      - name: Check shell scripts
        if: ${{ env.DEFAULT_OS == matrix.os && env.DEFAULT_JAVA == matrix.java }}
        run: .github/workflows/run_shellcheck.sh

  ossindex:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-java@v6
      with:
        cache: maven
        distribution: temurin
        java-version: 17
        server-id: ossindex
        server-username-env-var: OSSINDEX_USERNAME
        server-password-env-var: OSSINDEX_TOKEN
    - name: Ossindex
      run: |
        mvn -T 1C --errors --batch-mode test-compile \
            org.sonatype.ossindex.maven:ossindex-maven-plugin:audit \
            org.sonatype.ossindex.maven:ossindex-maven-plugin:audit-aggregate
      env:
        OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
        OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}

  native-image:
    # [bld->dsn~cli.native-executable~1]
    # [bld->dsn~cli.native-executable.support-built-in-plugins~1]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            output: openfasttrace-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            output: openfasttrace-linux-arm64
          - target: macos-arm64
            runner: macos-15
            output: openfasttrace-macos-arm64
          - target: windows-x64
            runner: windows-2025
            output: openfasttrace-windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    name: Native image ${{ matrix.target }}
    concurrency:
      group: ${{ github.workflow }}-native-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        name: Set up GraalVM 25
        with:
          version: '25.6'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Configure GraalVM 25 Maven toolchain
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://maven.apache.org/TOOLCHAINS/1.1.0 https://maven.apache.org/xsd/toolchains-1.1.0.xsd">
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>25</version>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Build and test native image with Maven
        run: >-
          mvn --batch-mode -T 1C -Pnative-image -pl native-image -am verify
          -Dossindex.skip=true
          -Djava.version=25
          -Dnative.image.name=${{ matrix.output }}

      - name: Upload native image
        uses: actions/upload-artifact@v7
        with:
          name: openfasttrace-native-${{ matrix.target }}
          path: native-image/target/${{ matrix.output }}*
          if-no-files-found: error

  build:
    permissions:
      contents: read
    needs:
    - matrix-build
    - ossindex
    - native-image
    runs-on: ubuntu-slim
    steps:
      - run: echo "Build successful"
