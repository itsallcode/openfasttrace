name: Release

on:
  workflow_dispatch:
    inputs:
      skip-deploy-maven-central:
        description: "Skip deployment to Maven Central"
        required: true
        type: boolean
        default: false
      maven-central-auto-publish:
        description: "Automatically publish to Maven Central"
        required: true
        type: boolean
        default: true

jobs:
  validate-release-preconditions:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Fail if not running on main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Not running on main branch, github.ref is ${GITHUB_REF}. Please start this workflow only on main."
          exit 1
        env:
          GITHUB_REF: ${{ github.ref }}

  native-images:
    needs: validate-release-preconditions
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-26.04
            output: openfasttrace-linux-x64
          - target: linux-arm64
            runner: ubuntu-26.04-arm
            output: openfasttrace-linux-arm64
          - target: macos-arm64
            runner: macos-26
            output: openfasttrace-macos-arm64
          - target: windows-x64
            runner: windows-2025
            output: openfasttrace-windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    name: Native image ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        name: Set up GraalVM 25
        with:
          version: '25.6'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Configure GraalVM 25 Maven toolchain
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://maven.apache.org/TOOLCHAINS/1.1.0 https://maven.apache.org/xsd/toolchains-1.1.0.xsd">
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>25</version>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Build and test native image with Maven
        run: >-
          mvn --batch-mode -T 1C -Pnative-image -pl native-image -am verify
          -Dossindex.skip=true
          -Djava.version=25
          -Dnative.image.name=${{ matrix.output }}

      - name: Upload native image
        uses: actions/upload-artifact@v7
        with:
          name: openfasttrace-native-${{ matrix.target }}
          path: native-image/target/${{ matrix.output }}*
          if-no-files-found: error

  release:
    needs:
      - validate-release-preconditions
      - native-images
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: "bash"
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: write # Required for creating GitHub release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fail if not running on main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Not running on main branch, github.ref is ${GITHUB_REF}. Please start this workflow only on main."
          exit 1
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Set up Maven Central Repository
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 17
          cache: "maven"
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Build
        run: mvn --batch-mode -T 1C clean install -Dossindex.skip=true

      - name: Download native images
        uses: actions/download-artifact@v8
        with:
          pattern: openfasttrace-native-*
          path: native-image/target
          merge-multiple: true

      - name: List secret GPG keys
        run: gpg --list-secret-keys

      - name: Publish to Maven Central Repository
        if: ${{ !inputs.skip-deploy-maven-central }}
        run: |
          mvn --batch-mode deploy -Dossindex.skip=true -PcentralPublishing \
               -DcentralPublishingSkipPublishing=false \
               -DcentralPublishingAutoPublish=${{ inputs.maven-central-auto-publish }} \
               -DcentralPublishingDeploymentName="Auto-deploy OpenFastTrace via release.yml"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_PORTAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Create GitHub Release
        # [bld->dsn~cli.native-executable.release-packaging~1]
        run: ./.github/workflows/github_release.sh
        env:
          GH_TOKEN: ${{ github.token }}
