title: OpenFastTrace
description: Requirement tracing suite for Agile Development

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

# Site settings
url: "https://openfasttrace.itsallcode.org"
baseurl: ""

# Navigation bar logo
logo: "assets/images/openfasttrace_logo.svg"

# Aux links for the sidebar
aux_links:
  "OpenFastTrace on GitHub":
    - https://github.com/itsallcode/openfasttrace

# GitHub edit link
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.com/itsallcode/openfasttrace"
gh_edit_branch: "main"
gh_edit_source: "doc"
gh_edit_view_mode: "edit"

# Heading anchor links
heading_anchors: true

# Search configuration
search_enabled: true
search:
  tokenizer_separator: /[\s/]+/
  rel_prefix: true

# Footer content
footer_content: ""

# Color scheme
color_scheme: light

# Exclude list
exclude:
  - vendor
  - .bundle
  - .jekyll-cache
  - .jekyll-metadata
  - Gemfile
  - Gemfile.lock
  - itsallcode_formatter.xml

include:
  - CNAME
  - assets

defaults:
  - scope:
      path: "changes"
    values:
      nav_exclude: true
  - scope:
      path: "changes/changes.md"
    values:
      nav_exclude: false
